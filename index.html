<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WoHinDamit?</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <h1>WoHinDamit?</h1>
    <p>Smart Recycling Vienna</p>
    <h2>Was möchtest du loswerden?</h2>
    <div class="search-box">
      <input
        type="text"
        id="itemInput"
        placeholder="Was möchtest du entsorgen? "
      />
      <button id="searchButton">suchen</button>
    </div>
    <div id="condition-box">
      <label for="condition"> Funktioniert der Gegenstand noch?</label>

      <select id="condition">
        <option value="ja">ja, Funktioniert</option>
        <option value="nein">Nein, defekt</option>
      </select>
    </div>

    <div id="repair-box">
      <label for="repairable"> Ist der Gegenstand reparierbar? </label>

      <select id="repairable">
        <option value="ja">Ja, reparierbar</option>
        <option value="nein">Nein, nicht reparierbar</option>
      </select>
    </div>

    <p id="result"></p>

    <script src="script.js"></script>
  </body>
</html>
